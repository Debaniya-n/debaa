<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <title>Working with elements</title>
  </head>
  <body>
    <style>
      @font-face {
	    font-family: "UD Digi Kyokasho NK-B";
	    src: url("/css/fonts/UDDigiKyokashoNK-B.eot");
	    src: url("/css/fonts/UDDigiKyokashoNK-B.woff") format("woff"),
	    url("/css/fonts/UDDigiKyokashoNK-B.otf") format("opentype"),
	    url("/css/fonts/UDDigiKyokashoNK-B.svg") format("svg");
	    }

      body{
        font-family: "UD Digi Kyokasho NK-B"
      }

      .warnlabel{
        width: calc(680px / 3 - 50px)!important;
        height:18px;
        z-index: 40;
        text-align: center;
        color:white;
        padding: 5px;
        padding-left: 10px;
        padding-right: 10px;
        border-radius: 10px;
        pointer-events: none;
        position: relative;
        top:-150px;
        left:75px;
        text-decoration: none;
        opacity: 0;
        -webkit-transition: all 0.1s ease-in-out;
	      -moz-transition: all 0.1s ease-in-out;
	      -ms-transition: all 0.1s ease-in-out;
	      -o-transition: all 0.1s ease-in-out;
	      transition: all 0.1s ease-in-out;
      }
      img.png:hover ~ .warnlabel{
        opacity: 100;
      }

      [id^='timerno']{
        width: calc(680px / 3 - 75px) !important;
        left: calc(75px + (25px/2)) !important; 
        top:-70px;
        opacity:100;
        margin-top: -28px; 
      }

      img.png:hover ~ [id^='timerno']{
        opacity: 0;
      }

      .pngcontainer{
        overflow-x:scroll;
        white-space: nowrap;
        height: 535px;
        background-color: black;
        color: white;
      }
      img.png{
          position: relative;
          width: calc(680px/2)!important;
          height: calc(902px/2)!important;
          animation: mover 4s infinite  alternate;
      }
      img.png:hover{
        -webkit-animation: speak-now 1s  alternate !important;
        animation: speak-now 1s  alternate !important;
      }
      a.png{
        display: inline-block;
        width: 190px; 
        height: 200px; 
        text-decoration: none;
      }

      @keyframes mover {
        0% { transform: translateY(0); }
        100% { transform: translateY(10px); }
      }

      @keyframes
        speak-now {
        0% { bottom:0px;  }
        15% { bottom:10px;  }
        30% { bottom:0px;  }
      }
    </style>
    <div class="pngcontainer" id="conta">
      <div id="div1" style="margin-left: 80px; position: absolute;">Swipe or use the scrollwheel to navigate...</div> 
    </div>
  </body>
  <script>

    async function checkIfLive(numid,channelcheck) {
      let myObject = await fetch("https://decapi.me/twitch/uptime/" + channelcheck);
      console.log("myObject is " + myObject);
      let myText = await myObject.text();
      console.log("myText is " + myText);
      switch(myText.startsWith(channelcheck)){
        case true:{
            console.log("true btw");
            break
        }
        case false:{
            const newDiv = document.getElementById("png"+numid);
            const warnDiv = document.createElement("div");
            warnDiv.classList.add("warnlabel");
            warnDiv.style = "background-color:Purple;"
            const warnText = document.createTextNode("Now LIVE on Twitch!");
            warnDiv.appendChild(warnText);
            newDiv.appendChild(warnDiv); 
            const timeDiv = document.createElement("div");
            timeDiv.classList.add("warnlabel");
            timeDiv.style = "background-color:Red;";
            const livebracket = document.createElement("label");
            const livebrackettext = document.createTextNode("LIVE (");
            livebracket.appendChild(livebrackettext);
            const livehours = document.createElement("label");
            const livehourstext = document.createTextNode("--")
            livehours.appendChild(livehourstext)
            livehours.setAttribute("id", "hours"+numid);
            const hourcolon = document.createElement("label");
            const hourcolontext = document.createTextNode(":");
            hourcolon.appendChild(hourcolontext);
            const liveminutes = document.createElement("label");
            const liveminutestext = document.createTextNode("--")
            liveminutes.appendChild(liveminutestext)
            liveminutes.setAttribute("id", "minutes"+numid);
            const minutecolon = document.createElement("label");
            const minutecolontext = document.createTextNode(":");
            minutecolon.appendChild(minutecolontext);
            const liveseconds = document.createElement("label");
            const livesecondstext = document.createTextNode("--")
            liveseconds.appendChild(livesecondstext)
            liveseconds.setAttribute("id", "seconds"+numid);
            const endbracket = document.createElement("label");
            const endbrackettext = document.createTextNode(")");
            endbracket.appendChild(endbrackettext);
            timeDiv.appendChild(livebracket);
            timeDiv.appendChild(livehours);
            timeDiv.appendChild(hourcolon);
            timeDiv.appendChild(liveminutes);
            timeDiv.appendChild(minutecolon);
            timeDiv.appendChild(liveseconds);
            timeDiv.appendChild(endbracket);
            timeDiv.setAttribute("id", "timerno"+numid);
            const timecont = document.getElementById("png"+numid);
            timecont.appendChild(timeDiv);
            const rawtimeArray = myText.split(",")
            const timeArray = [0,0,0];
            for(let o = 0; rawtimeArray[o] != undefined; o++){
                console.log("rawtimeArray[" + o + "] is " + rawtimeArray[o]);
                if(rawtimeArray[o].includes("hour")==true){
                    rawtimeArray[o] = rawtimeArray[o].replace("hour","");
                    rawtimeArray[o] = rawtimeArray[o].replace("s","");
                    rawtimeArray[o] = rawtimeArray[o].replace(" ","");
                    timeArray[0] = rawtimeArray[o];
                    console.log("timeArray[0] is " + timeArray[0]);
                }
                else if(rawtimeArray[o].includes("minute")==true){
                    rawtimeArray[o] = rawtimeArray[o].replace("minute","");
                    rawtimeArray[o] = rawtimeArray[o].replace("s","");
                    rawtimeArray[o] = rawtimeArray[o].replace(" ","");
                    timeArray[1] = rawtimeArray[o];
                    console.log("timeArray[1] is " + timeArray[1]);
                }
                else if(rawtimeArray[o].includes("second")==true){
                    rawtimeArray[o] = rawtimeArray[o].replace("second","");
                    rawtimeArray[o] = rawtimeArray[o].replace("s","");
                    rawtimeArray[o] = rawtimeArray[o].replace(" ","");
                    timeArray[2] = rawtimeArray[o];
                    console.log("timeArray[2] is " + timeArray[2]);
                }
            }
            const howmanysecs = parseInt(timeArray[0] * 3600) + parseInt(timeArray[1] * 60) + parseInt(timeArray[2]); 
            console.log(howmanysecs); 
            console.log(timeArray[0] + ":" + timeArray[1] + ":" + timeArray[2]); 
            var hoursLabel = document.getElementById("hours"+numid);
            var minutesLabel = document.getElementById("minutes"+numid);
            var secondsLabel = document.getElementById("seconds"+numid);
            var totalSeconds = howmanysecs;
            setInterval(setTime, 1000); 

            function setTime(){
                ++totalSeconds;
                secondsLabel.innerHTML = pad(totalSeconds%60);
                minutesLabel.innerHTML = pad(parseInt(totalSeconds / 60, 10) % 60);
                hoursLabel.innerHTML = pad(parseInt(totalSeconds / 3600, 10));
            }

            function pad(val){
                var valString = val + "";
                if(valString.length < 2){
                    return "0" + valString;
                }
                else{
                    return valString;
                }
            }
        }
      }
    }  

    const container = document.getElementById("conta");
    // where "container" is the id of the container
    container.addEventListener("wheel", function (e) {
      if (e.deltaY > 0) {
        container.scrollLeft += 100;
        e.preventDefault();
        // prevenDefault() will help avoid worrisome 
        // inclusion of vertical scroll 
      }
      else {
        container.scrollLeft -= 100;
        e.preventDefault();
      }
    });
    // That will work perfectly

    fetch('https://trello.com/b/COh3AaHn/png-database.json')
    .then((response) => response.json())
    .then((data) => {
            var delayer =0;
            for (let i = 0; data.cards[i].cover.idAttachment != "null"; i++) {
            console.log("i was called " + i + " times");
            var channelname = data.cards[i].desc;
            console.log("ID " + i + " Channel name is " + channelname);
            var imagelink = data.cards[i].cover.scaled[5].url;
            console.log("ID " + i + " .png url is " + imagelink); 
            // create a new div element
            const newDiv = document.createElement("a");
            newDiv.href = "https://www.twitch.tv/" + channelname;
            newDiv.classList.add("png"); 
            newDiv.setAttribute("id", "png"+i)
            console.log("i was called");

            // and give it some content
            const newContent = new Image(680,902);
            newContent.src = imagelink;
            newContent.classList.add("png")
            newContent.style = "animation-delay:" + delayer + "." + i + "s";
            delayer++;
            if(delayer === 4){
              delayer = 0;
            }
            console.log("i was called");

            // add the text node to the newly created div
            newDiv.appendChild(newContent);
            const errorcheck = data.cards[i].labels == ""; 
            console.log(errorcheck);
            if(errorcheck == false){
              var errorcolor = data.cards[i].labels[0].color;
              switch(errorcolor){
                case "red":
                case "orange":
                case "green":
                case "purple":
                case "yellow":
                case "blue":{
                  const warnDiv = document.createElement("div");
                  warnDiv.classList.add("warnlabel");
                  warnDiv.style = "background-color:" + errorcolor + ";"
                  const warnText = document.createTextNode(data.cards[i].labels[0].name);
                  warnDiv.appendChild(warnText);
                  newDiv.appendChild(warnDiv); 
                  break; 
                }
                default:{
                } 
              }
            }
            else{
              checkIfLive(i,channelname)
            }
            console.log("i was called");

            // add the newly created element and its content into the DOM
            const currentDiv = document.getElementById("div1");
            console.log("i was called"); 
            document.getElementById("conta").insertBefore(newDiv, currentDiv);
            }
        })
  </script>
</html>
