<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <title>Working with elements</title>
  </head>
  <body>
    <input
  type="text"
  id="name"
  name="name"
  required
  size="10" />
<script>
    
async function checkIfLive() {
    let file = document.getElementById("name").value
    let myObject = await fetch("https://decapi.me/twitch/uptime/" + file);
    console.log("myObject is " + myObject);
    let myText = await myObject.text();
    console.log("myText is " + myText);
    switch(myText.startsWith(file)){
        case true:{
            console.log("true btw");
            break
        }
        case false:{
            const rawtimeArray = myText.split(",")
            const timeArray = [0,0,0];
            for(let o = 0; rawtimeArray != ""; o++){
                if(rawtiimeArray[o].includes("hour")==true){
                    rawtimeArray[o] = rawtimeArray[o].replace("hour","");
                    rawtimeArray[o] = rawtimeArray[o].replace("s","");
                    rawtimeArray[o] = rawtimeArray[o].replace(" ","");
                    timeArray[0] = rawtimeArray[o];
                }
                else if(rawtiimeArray[o].includes("minute")==true){
                    rawtimeArray[o] = rawtimeArray[o].replace("minute","");
                    rawtimeArray[o] = rawtimeArray[o].replace("s","");
                    rawtimeArray[o] = rawtimeArray[o].replace(" ","");
                    timeArray[1] = rawtimeArray[o];
                }
                else if(rawtiimeArray[o].includes("second")==true){
                    rawtimeArray[o] = rawtimeArray[o].replace("second","");
                    rawtimeArray[o] = rawtimeArray[o].replace("s","");
                    rawtimeArray[o] = rawtimeArray[o].replace(" ","");
                    timeArray[2] = rawtimeArray[o];
                }
            }
            const howmanysecs = parseInt(timeArray[0] * 3600) + parseInt(timeArray[1] * 60) + parseInt(timeArray[2]); 
            console.log(howmanysecs); 
            console.log(timeArray[0] + ":" + timeArray[1] + ":" + timeArray[2]); 
            var hoursLabel = document.getElementById("hours");
            var minutesLabel = document.getElementById("minutes");
            var secondsLabel = document.getElementById("seconds");
            var totalSeconds = howmanysecs;
            setInterval(setTime, 1000); 

            function setTime(){
                ++totalSeconds;
                secondsLabel.innerHTML = pad(totalSeconds%60);
                minutesLabel.innerHTML = pad(parseInt(totalSeconds / 60, 10) % 60);
                hoursLabel.innerHTML = pad(parseInt(totalSeconds / 3600, 10));
            }

            function pad(val){
                var valString = val + "";
                if(valString.length < 2){
                    return "0" + valString;
                }
                else{
                    return valString;
                }
            }
        }
    }
    document.getElementById("demo").innerHTML = myText; 
} 

</script>
<button onclick="checkIfLive()">Click me</button> 
<p id="demo">Fetch a file to change this text.</p>
<label >Live (</label>
<label id="hours">00</label>
<label >:</label>
<label id="minutes">00</label>
<label id="colon">:</label>
<label id="seconds">00</label>
<label >)</label>
</body>
